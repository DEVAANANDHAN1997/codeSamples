spring.queries.users-query=select username, password, enabled from new_users where username=?
spring.queries.roles-query=SELECT new_user_roles.username, new_roles.role FROM new_user_roles INNER JOIN new_roles ON new_roles.roleid=new_user_roles .role_id where new_user_roles.username =?

